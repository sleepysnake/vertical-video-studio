name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify tag matches application version
        run: |
          $version = python -c "from studio.version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and application version differ" }
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate packages
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - name: Publish release
        run: |
          $version = python -c "from studio.version import __version__; print(__version__)"
          gh release create $env:GITHUB_REF_NAME "release/VerticalVideoStudio-$version-Windows.zip" "release/VerticalVideoStudio-$version-Source.zip" --verify-tag --title "Vertical Video Studio $version" --generate-notes
